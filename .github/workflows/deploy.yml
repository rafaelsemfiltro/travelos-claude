# claude: deploy TravelOS PWA para GitHub Pages após CI verde
name: Deploy

on:
  push:
    branches: [main]

# Permissões necessárias para deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Só um deploy por vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npm run build
        env:
          PUBLIC_AI_WORKER_URL: https://travelos-claude-guide.rafaelsemfiltro-1.workers.dev

      - uses: actions/configure-pages@v4

      # claude: prevent Jekyll from mangling files/folders starting with _ on GitHub Pages
      - name: Add .nojekyll
        run: touch build/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
